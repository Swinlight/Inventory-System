<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptops — Device Inventory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="breadcrumb">Inventory &nbsp;/&nbsp; <b>Laptops</b></div>
    <div class="greet-row">
      <div><h1>Laptops</h1><div class="sub">Manage laptop inventory</div></div>
      <div class="greet-actions"><button class="btn-green" id="addBtn">+ Add laptop</button></div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search asset, tag, holder, serial…">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option>Available</option><option>Assigned</option><option>Repair</option>
        <option>Defective</option><option>Retired</option>
      </select>
    </div>

    <div class="tablewrap">
      <table id="table">
        <thead><tr>
          <th>Asset name</th><th>Type</th><th>Asset tag</th><th>Holder</th><th>Serial number</th>
          <th>Previous holders</th>
          <th>Status</th><th>Defective</th><th>For repair</th><th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Add laptop</h2>

    <div class="field"><label>Asset name</label><input type="text" id="f_assetName" placeholder="e.g. MacBook Pro 14-inch"></div>

    <div class="field-row">
      <div class="field"><label>Type</label>
        <select id="f_type"><option>Laptop</option><option>Phone</option></select>
      </div>
      <div class="field"><label>Asset tag</label><input type="text" id="f_assetTag" placeholder="e.g. AST-025"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Holder</label><input type="text" id="f_holder" placeholder="Unassigned"></div>
      <div class="field"><label>Previous holders</label><input type="text" id="f_previousHolders" placeholder="e.g. Alex Kim, Priya Shah"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Date given</label><input type="date" id="f_dateGiven"></div>
      <div class="field"><label>Date returned</label><input type="date" id="f_dateReturned"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Purchase date</label><input type="date" id="f_purchaseDate"></div>
      <div class="field"><label>Purchase amount (PHP)</label><input type="number" step="0.01" min="0" id="f_purchaseAmount" placeholder="₱0.00"></div>
    </div>

    <div class="field-row">
      <div class="field"><label>Status</label>
        <select id="f_status"><option>Available</option><option>Assigned</option><option>Repair</option><option>Defective</option><option>Retired</option></select>
      </div>
      <div class="field"><label>Stock</label>
        <select id="f_stock"><option>In stock</option><option>Out of stock</option></select>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Defective</label>
        <select id="f_defective"><option>No</option><option>Yes</option></select>
      </div>
      <div class="field"><label>For repair</label>
        <select id="f_forRepair"><option>No</option><option>Yes</option></select>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Warranty expired</label>
        <select id="f_warrantyExpired"><option>No</option><option>Yes</option></select>
      </div>
      <div class="field"><label>Serial number</label><input type="text" id="f_serial" placeholder="e.g. SN-4821XK"></div>
    </div>

    <div class="field"><label>Notes</label><textarea id="f_notes" rows="3" placeholder="e.g. Installed 16 GB RAM; cracked screen"></textarea></div>

    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>initInventoryPage("Laptop");</script>
</body>
</html>
