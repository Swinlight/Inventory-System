<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview — Device Inventory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content">
    <div class="breadcrumb">Inventory &nbsp;/&nbsp; <b>Overview</b></div>

    <div class="greet-row">
      <div>
        <div class="eyebrow" id="todayDate">TODAY</div>
        <h1>Device inventory</h1>
        <div class="sub">Here's what's happening with your equipment.</div>
      </div>
      <div class="greet-actions">
        <a href="laptops.html" class="btn-ghost">View laptops</a>
        <a href="phones.html" class="btn-ghost">View phones</a>
      </div>
    </div>

    <div class="cardgrid" id="cardgrid"></div>

    <div class="overview-grid">
      <div class="dash-panel">
        <div class="section-h"><h2>Inventory by status</h2></div>
        <div class="donut-row">
          <div class="donut" id="donut"><div class="donut-hole"><div class="n" id="donutTotal">0</div><div class="l">assets</div></div></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div class="dash-panel">
        <div class="section-h"><h2>Recent activity</h2></div>
        <div id="activity"></div>
      </div>
    </div>

    <div class="dash-panel">
      <div class="section-h">
        <h2>Recently updated</h2>
        <div class="tabs-pill">
          <button class="active" data-filter="All">All</button>
          <button data-filter="In use">In use</button>
          <button data-filter="Available">Available</button>
        </div>
      </div>
      <div class="controls"><input type="text" id="homeSearch" placeholder="Search by asset, holder, tag, or serial…"></div>
      <div class="tablewrap">
        <table style="min-width:640px">
          <thead><tr><th>Asset</th><th>Type</th><th>Holder</th><th>Status</th><th>Last updated</th></tr></thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>renderHome();</script>
</body>
</html>
